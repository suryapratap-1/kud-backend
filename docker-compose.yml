# Local services for development. In production, point DATABASE_URL at Neon/Supabase and SMTP at a real provider.
# Ports are bound to 127.0.0.1 so only this computer can reach them, not others on your network.
name: kudos

services:
  postgres:
    image: postgres:17-alpine
    container_name: kudos-postgres
    environment:
      POSTGRES_USER: kudos
      POSTGRES_PASSWORD: kudos
      POSTGRES_DB: kudos
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudos"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kudos-mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Inbox UI at http://localhost:8025
    restart: unless-stopped

volumes:
  pgdata:
    # Created when this file lived in the frontend repo; reused so local data isn't lost.
    name: wondering_kudos-pgdata
